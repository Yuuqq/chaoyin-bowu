<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>潮音博物 · 异质知识图谱 v0.1 交互漫游台（108 节点 / 210 三元组）</title>
  <link rel="stylesheet" href="./theme.css" />
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    main.graph-grid {
      width: 100%;
      max-width: 1520px;
      margin: 0 auto;
      padding: 12px 20px 16px;
      display: grid;
      grid-template-columns: 292px 1fr 356px;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .panel-col {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .search-field {
      width: 100%;
      padding: 8px 11px;
      border-radius: var(--r-md);
      border: 1px solid var(--border-strong);
      background: var(--surface-subtle);
      color: var(--ink-primary);
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
    }
    .search-field:focus {
      background: #ffffff;
      border-color: var(--celadon-700);
      box-shadow: 0 0 0 3px rgba(15, 82, 90, 0.10);
    }

    .bridge-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border-radius: var(--r-md);
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      color: var(--err-700);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .bridge-card input {
      accent-color: var(--err-700);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .type-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 3px;
    }
    .type-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 9px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border-hairline);
      background: var(--surface-subtle);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.15s, background 0.15s;
    }
    .type-item:hover {
      background: #ffffff;
    }
    .type-item.muted {
      opacity: 0.36;
    }
    .type-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .type-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .type-cnt {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-secondary);
      background: #ffffff;
      padding: 1px 6px;
      border-radius: var(--r-pill);
      border: 1px solid var(--border-hairline);
    }

    .hub-section {
      padding-top: 8px;
      border-top: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hub-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .hub-chip {
      border: 1px solid var(--border-hairline);
      background: var(--surface-subtle);
      color: var(--ink-primary);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: var(--r-pill);
      cursor: pointer;
      transition: all 0.15s;
    }
    .hub-chip:hover {
      background: var(--celadon-700);
      border-color: var(--celadon-700);
      color: #ffffff;
    }

    /* Center FigJam-style Graph Canvas */
    .canvas-panel {
      padding: 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .canvas-wrap {
      position: relative;
      flex: 1;
      border-radius: var(--r-md);
      border: 1px solid var(--border-hairline);
      background-color: #faf8f4;
      background-image: radial-gradient(rgba(24, 34, 40, 0.12) 1px, transparent 1px);
      background-size: 20px 20px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }

    .canvas-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: var(--r-pill);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-float);
    }
    .hud-btn {
      border: none;
      background: transparent;
      color: var(--ink-primary);
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: var(--r-pill);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .hud-btn:hover {
      background: var(--surface-sand);
    }
    .hud-btn.active {
      background: var(--celadon-700);
      color: #ffffff;
    }
    .hud-sep {
      width: 1px;
      height: 16px;
      background: var(--border-hairline);
    }

    .hover-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(24, 34, 40, 0.88);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: var(--r-pill);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .hover-pill.show {
      opacity: 1;
    }

    .canvas-tip {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-hairline);
      padding: 5px 14px;
      border-radius: var(--r-pill);
      font-size: 11px;
      color: var(--ink-secondary);
      white-space: nowrap;
      pointer-events: none;
    }

    /* Right Inspector */
    .entity-card {
      background: var(--surface-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-md);
      padding: 13px;
    }
    .entity-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .entity-badge {
      font-size: 10.5px;
      font-weight: 600;
      color: #ffffff;
      padding: 2px 9px;
      border-radius: var(--r-pill);
    }
    .deg-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--celadon-900);
      background: var(--celadon-100);
      padding: 2px 8px;
      border-radius: var(--r-pill);
    }
    .entity-name {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink-primary);
      line-height: 1.3;
    }
    .entity-phon {
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-sm);
      padding: 7px 9px;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--ink-secondary);
    }
    .entity-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .act-pill {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: var(--r-pill);
      transition: all 0.15s;
    }
    .act-primary {
      background: var(--celadon-700);
      color: #ffffff;
    }
    .act-primary:hover {
      background: var(--celadon-900);
    }
    .act-secondary {
      background: #ffffff;
      color: var(--celadon-900);
      border: 1px solid var(--border-strong);
    }
    .act-secondary:hover {
      border-color: var(--celadon-700);
    }

    .triple-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 3px;
    }
    .triple-row {
      font-size: 12px;
      padding: 8px 10px;
      background: var(--surface-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-sm);
      cursor: pointer;
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s;
    }
    .triple-row:hover {
      background: #ffffff;
      border-color: var(--celadon-700);
    }
    .triple-row.bridge {
      background: var(--err-bg);
      border-color: var(--err-border);
    }
    .rel-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      background: var(--celadon-100);
      color: var(--celadon-900);
      padding: 1px 6px;
      border-radius: var(--r-pill);
      margin: 0 3px;
    }
    .triple-row.bridge .rel-tag {
      background: rgba(179, 38, 30, 0.12);
      color: var(--err-700);
    }

    .cypher-card {
      background: var(--surface-code);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-md);
      padding: 9px 11px;
    }
    .cypher-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-secondary);
    }
    .copy-cypher-btn {
      border: 1px solid var(--border-hairline);
      background: #ffffff;
      color: var(--ink-primary);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--r-pill);
      cursor: pointer;
    }
    .copy-cypher-btn:hover {
      border-color: var(--celadon-700);
      color: var(--celadon-700);
    }
    .cypher-box {
      font-family: var(--font-mono);
      font-size: 10.8px;
      color: var(--celadon-900);
      line-height: 1.5;
      max-height: 86px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    @media (max-width: 1120px) {
      body { height: auto; overflow: auto; }
      main.graph-grid { grid-template-columns: 1fr; }
      .canvas-wrap { min-height: 460px; }
    }
  </style>
</head>

  <script>
    (function () {
      const KG = window.CHAOYIN_KG_DATA;
      const m = KG.metrics;
      document.getElementById("kg-subtitle").textContent =
        `汕头市濠江区先导库 · ${m.total_nodes} 个异质节点 · ${m.total_edges_triples} 条语义三元组 · ${m.cross_category_bridges_count} 条跨门类桥接`;
      document.getElementById("kpi-nodes").textContent = m.total_nodes;
      document.getElementById("kpi-edges").textContent = m.total_edges_triples;
      document.getElementById("kpi-bridges").textContent = m.cross_category_bridges_count;

      const params = new URLSearchParams(window.location.search);
      const focusParam = params.get("focus");

      const hiddenTypes = new Set();
      let onlyBridges = false;
      let searchTerm = "";
      let selectedId = focusParam && KG.nodes.some(n => n.id === focusParam) ? focusParam : "CY-AF-001";
      let hoveredNode = null;
      let layoutMode = "shell";

      const nodeMap = new Map();
      const ringMap = {
        CountyUnit: 0, Category: 1, Street: 1, AccentPoint: 1,
        NominalItem: 2, KeyMorpheme: 3, SpatialSite: 3, PhoneticFeature: 3, HeritageLevel: 3,
        CraftAndMaterial: 4, FolkAliasOrTrap: 4
      };

      const groupedByRing = { 0: [], 1: [], 2: [], 3: [], 4: [] };
      KG.nodes.forEach(n => {
        const r = ringMap[n.node_type] ?? 3;
        groupedByRing[r].push(n);
      });
      const ringRadii = { 0: 0, 1: 108, 2: 208, 3: 300, 4: 382 };
      Object.entries(groupedByRing).forEach(([r, arr]) => {
        arr.sort((a, b) => a.id.localeCompare(b.id));
        const rad = ringRadii[r];
        arr.forEach((n, idx) => {
          const theta = (2 * Math.PI * idx) / Math.max(1, arr.length) + Number(r) * 0.17;
          n.sx = rad * Math.cos(theta);
          n.sy = rad * Math.sin(theta);
          n.x = n.sx;
          n.y = n.sy;
          n.vx = 0;
          n.vy = 0;
          nodeMap.set(n.id, n);
        });
      });

      const toastEl = document.getElementById("toast");
      let toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
      }

      const typeListEl = document.getElementById("type-list");
      Object.entries(KG.node_type_catalog).forEach(([ntype, info]) => {
        const cnt = m.node_type_breakdown[ntype] || 0;
        const div = document.createElement("div");
        div.className = "type-item";
        div.innerHTML = `<span class="type-left"><span class="type-dot" style="background:${info.color}"></span><span>${info.zh}</span></span><span class="type-cnt">${cnt}</span>`;
        div.addEventListener("click", () => {
          if (hiddenTypes.has(ntype)) {
            hiddenTypes.delete(ntype);
            div.classList.remove("muted");
          } else {
            hiddenTypes.add(ntype);
            div.classList.add("muted");
          }
          draw();
        });
        typeListEl.appendChild(div);
      });

      document.getElementById("only-bridges").addEventListener("change", (e) => {
        onlyBridges = e.target.checked;
        draw();
      });

      document.getElementById("search-box").addEventListener("input", (e) => {
        searchTerm = e.target.value.trim().toLowerCase();
        if (searchTerm) {
          const hit = KG.nodes.find(n =>
            n.label.toLowerCase().includes(searchTerm) ||
            n.id.toLowerCase().includes(searchTerm) ||
            (n.pengim && n.pengim.toLowerCase().includes(searchTerm))
          );
          if (hit) selectNode(hit.id, false);
        }
        draw();
      });

      document.querySelectorAll(".hub-chip").forEach(btn => {
        btn.addEventListener("click", () => selectNode(btn.dataset.id, true));
      });

      const wrap = document.getElementById("canvas-wrap");
      const canvas = document.getElementById("kg-canvas");
      const ctx = canvas.getContext("2d");
      const hoverPill = document.getElementById("hover-pill");
      let camX = 0, camY = 0, camScale = 0.84;
      let draggingNode = null, panning = false, lastMX = 0, lastMY = 0;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = wrap.clientWidth * dpr;
        canvas.height = wrap.clientHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }
      window.addEventListener("resize", resize);

      function screenToWorld(sx, sy) {
        const cx = wrap.clientWidth / 2 + camX;
        const cy = wrap.clientHeight / 2 + camY;
        return { x: (sx - cx) / camScale, y: (sy - cy) / camScale };
      }

      function isNodeVisible(n) {
        if (hiddenTypes.has(n.node_type)) return false;
        if (onlyBridges) {
          return KG.edges.some(e => e.is_cross_bridge && (e.source === n.id || e.target === n.id));
        }
        return true;
      }

      function nodeRadius(n) {
        if (n.node_type === "CountyUnit") return 14;
        if (n.node_type === "NominalItem") return 9.5;
        if (n.node_type === "Category" || n.node_type === "Street") return 8.5;
        return 6.2;
      }

      function findHit(sx, sy) {
        const w = screenToWorld(sx, sy);
        for (let i = KG.nodes.length - 1; i >= 0; i--) {
          const n = KG.nodes[i];
          if (!isNodeVisible(n)) continue;
          if (Math.hypot(n.x - w.x, n.y - w.y) <= nodeRadius(n) + 5) return n;
        }
        return null;
      }

      function runForceRelaxation(steps) {
        const nodes = KG.nodes;
        for (let s = 0; s < steps; s++) {
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i], b = nodes[j];
              let dx = b.x - a.x, dy = b.y - a.y;
              let d2 = dx * dx + dy * dy + 60;
              let f = 4400 / d2;
              let d = Math.sqrt(d2);
              a.vx -= (dx / d) * f;
              a.vy -= (dy / d) * f;
              b.vx += (dx / d) * f;
              b.vy += (dy / d) * f;
            }
          }
          KG.edges.forEach(e => {
            const a = nodeMap.get(e.source), b = nodeMap.get(e.target);
            if (!a || !b) return;
            let dx = b.x - a.x, dy = b.y - a.y;
            let d = Math.hypot(dx, dy) || 1;
            let target = e.is_cross_bridge ? 185 : 132;
            let f = (d - target) * 0.022;
            a.vx += (dx / d) * f;
            a.vy += (dy / d) * f;
            b.vx -= (dx / d) * f;
            b.vy -= (dy / d) * f;
          });
          nodes.forEach(n => {
            if (n.id === "COUNTY-HAOJIANG") { n.x = 0; n.y = 0; return; }
            n.vx -= n.x * 0.004;
            n.vy -= n.y * 0.004;
            n.x += n.vx * 0.34;
            n.y += n.vy * 0.34;
            n.vx *= 0.64;
            n.vy *= 0.64;
          });
        }
      }

      const btnShell = document.getElementById("btn-shell");
      const btnForce = document.getElementById("btn-force");
      btnShell.addEventListener("click", () => {
        layoutMode = "shell";
        btnShell.classList.add("active");
        btnForce.classList.remove("active");
        KG.nodes.forEach(n => { n.x = n.sx; n.y = n.sy; });
        draw();
      });
      btnForce.addEventListener("click", () => {
        layoutMode = "force";
        btnForce.classList.add("active");
        btnShell.classList.remove("active");
        runForceRelaxation(130);
        draw();
      });

      document.getElementById("btn-zoom-in").addEventListener("click", () => {
        camScale = Math.min(2.6, camScale * 1.18);
        draw();
      });
      document.getElementById("btn-zoom-out").addEventListener("click", () => {
        camScale = Math.max(0.35, camScale * 0.85);
        draw();
      });

      document.getElementById("btn-reset").addEventListener("click", () => {
        camX = 0; camY = 0; camScale = 0.84;
        onlyBridges = false;
        document.getElementById("only-bridges").checked = false;
        hiddenTypes.clear();
        document.querySelectorAll(".type-item").forEach(el => el.classList.remove("muted"));
        draw();
      });

      canvas.addEventListener("mousedown", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        lastMX = mx; lastMY = my;
        const hit = findHit(mx, my);
        if (hit) {
          draggingNode = hit;
          selectNode(hit.id, false);
        } else {
          panning = true;
        }
      });

      window.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        if (draggingNode) {
          const w = screenToWorld(mx, my);
          draggingNode.x = w.x;
          draggingNode.y = w.y;
          draw();
          return;
        }
        if (panning) {
          camX += mx - lastMX;
          camY += my - lastMY;
          lastMX = mx; lastMY = my;
          draw();
          return;
        }
        if (mx >= 0 && my >= 0 && mx <= rect.width && my <= rect.height) {
          const hit = findHit(mx, my);
          if (hit !== hoveredNode) {
            hoveredNode = hit;
            canvas.style.cursor = hit ? "pointer" : "grab";
            if (hit) {
              hoverPill.textContent = `${hit.node_type_zh}：${hit.label}（连接度 ${hit.degree}）`;
              hoverPill.classList.add("show");
            } else {
              hoverPill.classList.remove("show");
            }
          }
        }
      });
      window.addEventListener("mouseup", () => { draggingNode = null; panning = false; });

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 0.89;
        camScale = Math.max(0.35, Math.min(2.6, camScale * factor));
        draw();
      }, { passive: false });

      function selectNode(nid, recenter) {
        selectedId = nid;
        const n = nodeMap.get(nid);
        if (!n) return;
        if (recenter) {
          camX = -n.x * camScale * 0.35;
          camY = -n.y * camScale * 0.35;
        }
        renderInspector(n);
        draw();
      }

      function renderInspector(n) {
        const card = document.getElementById("entity-card");
        const isNominal = n.node_type === "NominalItem";
        let extraHtml = "";
        if (n.pengim) {
          extraHtml += `<div class="entity-phon"><div><strong>1960 潮拼：</strong><span class="mono">${n.pengim}</span></div><div><strong>国际音标：</strong><span class="mono">${n.ipa || ""}</span></div></div>`;
        }
        if (isNominal) {
          extraHtml += `<div class="entity-actions">
            <a class="act-pill act-primary" href="index.html?id=${n.id}">声学图鉴详情 ↗</a>
            <a class="act-pill act-secondary" href="mobile.html?id=${n.id}">手机扫码卡 ↗</a>
          </div>`;
        }
        card.innerHTML = `
          <div class="entity-top">
            <span class="entity-badge" style="background:${n.color}">${n.node_type_zh} · ${n.id}</span>
            <span class="deg-pill">度 ${n.degree}</span>
          </div>
          <div class="entity-name">${n.full_orthography || n.label}</div>
          ${extraHtml}
        `;

        const related = KG.edges.filter(e => e.source === n.id || e.target === n.id);
        document.getElementById("triple-header").textContent = `一跳关联语义三元组（共 ${related.length} 条）`;
        const tList = document.getElementById("triple-list");
        tList.innerHTML = "";
        related.forEach(e => {
          const sNode = nodeMap.get(e.source), tNode = nodeMap.get(e.target);
          const otherId = e.source === n.id ? e.target : e.source;
          const row = document.createElement("div");
          row.className = "triple-row" + (e.is_cross_bridge ? " bridge" : "");
          row.innerHTML = `<strong>${sNode ? sNode.label : e.source}</strong><span class="rel-tag">${e.relation}</span><strong>${tNode ? tNode.label : e.target}</strong><div style="color:var(--ink-muted);font-size:11px;margin-top:3px;">${e.label}</div>`;
          row.addEventListener("click", () => selectNode(otherId, false));
          tList.appendChild(row);
        });

        const cypher = `// 查询节点 ${n.id}（${n.label}）的一跳多模态子图\nMATCH (center {id: '${n.id}'})-[r]-(neighbor)\nRETURN center, type(r) AS relation, r.note AS note, neighbor;`;
        document.getElementById("cypher-box").textContent = cypher;
      }

      document.getElementById("btn-copy-cypher").addEventListener("click", () => {
        const txt = document.getElementById("cypher-box").textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(() => showToast("已复制 Neo4j Cypher 语句"));
        }
      });

      function draw() {
        const w = wrap.clientWidth, h = wrap.clientHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.translate(w / 2 + camX, h / 2 + camY);
        ctx.scale(camScale, camScale);

        if (layoutMode === "shell") {
          [108, 208, 300, 382].forEach(rad => {
            ctx.beginPath();
            ctx.arc(0, 0, rad, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(15, 82, 90, 0.10)";
            ctx.setLineDash([4, 5]);
            ctx.lineWidth = 1;
            ctx.stroke();
          });
          ctx.setLineDash([]);
        }

        const neighborSet = new Set([selectedId]);
        KG.edges.forEach(e => {
          if (e.source === selectedId) neighborSet.add(e.target);
          if (e.target === selectedId) neighborSet.add(e.source);
        });

        let visNodes = 0;
        KG.edges.forEach(e => {
          const a = nodeMap.get(e.source), b = nodeMap.get(e.target);
          if (!a || !b || !isNodeVisible(a) || !isNodeVisible(b)) return;
          if (onlyBridges && !e.is_cross_bridge) return;
          const active = e.source === selectedId || e.target === selectedId;
          ctx.beginPath();
          if (e.is_cross_bridge) {
            const mx = (a.x + b.x) / 2 - (b.y - a.y) * 0.18;
            const my = (a.y + b.y) / 2 + (b.x - a.x) * 0.18;
            ctx.moveTo(a.x, a.y);
            ctx.quadraticCurveTo(mx, my, b.x, b.y);
            ctx.strokeStyle = active ? "#B3261E" : "rgba(179, 38, 30, 0.72)";
            ctx.lineWidth = active ? 2.5 : 1.5;
          } else {
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = active ? "#0F525A" : "rgba(112, 127, 138, 0.22)";
            ctx.lineWidth = active ? 1.8 : 0.8;
          }
          ctx.stroke();
        });

        // Draw non-selected nodes first, then selected + 1-hop neighbors on top for clean layering
        const orderedNodes = [];
        KG.nodes.forEach(n => { if (!isNodeVisible(n)) return; visNodes++; if (!neighborSet.has(n.id)) orderedNodes.push(n); });
        KG.nodes.forEach(n => { if (!isNodeVisible(n)) return; if (neighborSet.has(n.id) && n.id !== selectedId) orderedNodes.push(n); });
        const selObj = nodeMap.get(selectedId);
        if (selObj && isNodeVisible(selObj)) orderedNodes.push(selObj);

        orderedNodes.forEach(n => {
          const rad = nodeRadius(n);
          const isSel = n.id === selectedId;
          const isNbr = neighborSet.has(n.id);
          const matchSearch = searchTerm && (n.label.toLowerCase().includes(searchTerm) || n.id.toLowerCase().includes(searchTerm));

          ctx.globalAlpha = (!selectedId || isNbr || onlyBridges || matchSearch) ? 1.0 : 0.25;
          if (isSel) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, rad + 6, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(15, 82, 90, 0.18)";
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(n.x, n.y, rad, 0, Math.PI * 2);
          ctx.fillStyle = n.color;
          ctx.fill();
          ctx.lineWidth = isSel || matchSearch ? 2.6 : 1.4;
          ctx.strokeStyle = isSel || matchSearch ? "#C05F1D" : "#FFFFFF";
          ctx.stroke();

          const showLbl = isSel || isNbr || n.node_type === "CountyUnit" ||
            (layoutMode === "shell" && n.node_type === "NominalItem") || camScale > 1.28;
          if (showLbl) {
            ctx.font = (isSel || n.node_type === "NominalItem")
              ? "700 11px 'PingFang SC', 'Microsoft YaHei', sans-serif"
              : "600 10px 'PingFang SC', 'Microsoft YaHei', sans-serif";
            ctx.textAlign = "center";
            ctx.lineJoin = "round";
            ctx.strokeStyle = "rgba(250, 248, 244, 0.94)";
            ctx.lineWidth = 3.8;
            ctx.strokeText(n.label, n.x, n.y + rad + 13);
            ctx.fillStyle = isSel ? "#0B3940" : "#182228";
            ctx.fillText(n.label, n.x, n.y + rad + 13);
          }
        });
        ctx.globalAlpha = 1.0;
        ctx.restore();
        document.getElementById("visible-count").textContent = `${visNodes}/${m.total_nodes}`;
      }

      resize();
      selectNode(selectedId, focusParam ? true : false);
    })();
  </script>
</body>
</html>
