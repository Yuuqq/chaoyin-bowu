<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识图谱 · 潮音博物</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    body { min-height: 100vh; }
    .intro {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    .intro h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.3; }
    .intro p { margin: 4px 0 0; font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink-3);
    }
    .toolbar button {
      background: none;
      border: 0;
      padding: 0 0 2px;
      cursor: pointer;
      color: var(--ink-2);
      border-bottom: 1px solid transparent;
    }
    .toolbar button:hover { color: var(--ink); }
    .toolbar button.on { color: var(--ink); border-bottom-color: var(--ink); }
    .toolbar .grp { display: flex; gap: 12px; align-items: center; }

    .layout {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) 290px;
      gap: 0 36px;
      margin-top: 18px;
      align-items: start;
    }

    .legend input[type="search"] {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
      padding: 6px 0;
      font-size: 14.5px;
      outline: none;
      margin: 8px 0 16px;
    }
    .legend input::placeholder { color: var(--ink-3); }
    .lg-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: none;
      border: 0;
      padding: 4px 0;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      color: var(--ink-2);
    }
    .lg-item .sw { width: 9px; height: 9px; flex-shrink: 0; }
    .lg-item .nm { flex: 1; }
    .lg-item .ct { font-family: var(--latin); font-size: 12.5px; color: var(--ink-3); }
    .lg-item.off { color: var(--ink-3); text-decoration: line-through; }
    .lg-item.off .sw { opacity: 0.3; }
    .bridge-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--hair);
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
    }
    .bridge-toggle input { accent-color: var(--red); }
    .hubs { margin-top: 16px; font-family: var(--sans); font-size: 13px; line-height: 2; color: var(--ink-3); }
    .hubs button {
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-family: var(--serif);
      font-size: 14px;
      color: var(--ink-2);
      border-bottom: 1px solid var(--hair);
      margin-right: 10px;
    }
    .hubs button:hover { color: var(--red); border-bottom-color: var(--red); }

    .canvas-wrap {
      position: relative;
      height: calc(100vh - 230px);
      min-height: 520px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .canvas-note {
      position: absolute;
      left: 0;
      bottom: -26px;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--ink-3);
    }
    .hover-tip {
      position: absolute;
      top: 10px;
      right: 0;
      font-family: var(--sans);
      font-size: 12.5px;
      color: var(--ink-2);
      background: var(--paper);
      padding: 2px 0 2px 8px;
      pointer-events: none;
    }

    .inspector .type { font-family: var(--sans); font-size: 12px; letter-spacing: 0.12em; color: var(--ink-3); }
    .inspector .name { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 4px 0 6px; letter-spacing: 0.03em; }
    .inspector .pron { gap: 2px 14px; }
    .inspector .pengim { font-size: 17px; }
    .inspector .ipa { font-size: 14px; }
    .inspector .deg { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
    .inspector .acts { display: flex; gap: 18px; margin-top: 10px; font-family: var(--sans); font-size: 13px; }
    .inspector .acts a { color: var(--red); border-bottom: 1px solid rgba(168, 50, 29, 0.35); }
    .rel-head {
      margin: 22px 0 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--rule);
      font-family: var(--sans);
      font-size: 12.5px;
      letter-spacing: 0.12em;
      color: var(--ink-3);
    }
    .rel-list { max-height: calc(100vh - 470px); min-height: 200px; overflow-y: auto; }
    .rel {
      display: block;
      width: 100%;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--hair);
      padding: 8px 0;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink);
    }
    .rel .r { font-family: var(--sans); font-size: 12px; color: var(--ink-3); margin: 0 6px; }
    .rel.bridge .r { color: var(--red); }
    .rel:hover { color: var(--red); }
    details.cypher { margin-top: 14px; font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); }
    details.cypher summary { cursor: pointer; }
    details.cypher pre {
      margin: 8px 0 0;
      padding: 10px 0;
      border-top: 1px solid var(--hair);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--ink-2);
      white-space: pre-wrap;
    }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: minmax(0, 1fr) 280px; }
      .legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 18px; margin-bottom: 18px; }
      .legend input[type="search"] { width: 220px; margin: 0 18px 0 0; }
      .lg-item { width: auto; }
      .bridge-toggle, .hubs { margin-top: 6px; padding-top: 0; border: 0; width: 100%; }
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .canvas-wrap { height: 460px; min-height: 0; }
      .inspector { margin-top: 44px; }
      .rel-list { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="masthead">
        <a class="wordmark" href="index.html">
          <span class="seal" aria-hidden="true">潮音</span>
          <span class="wm-text">
            <span class="wm-title">潮音博物</span>
            <span class="wm-sub">汕头濠江方言风物录</span>
          </span>
        </a>
        <nav class="topnav">
          <span class="crumb">研究工具</span>
          <a href="index.html">词目</a>
          <a href="about.html">关于本项目</a>
        </nav>
      </div>
      <div class="rules"></div>
    </header>

    <div class="intro">
      <div>
        <h1>知识图谱</h1>
        <p id="kg-sub"></p>
      </div>
      <div class="toolbar">
        <span class="grp">布局
          <button id="lay-shell" class="on">同心环</button>
          <button id="lay-force">力导向</button>
        </span>
        <span class="grp">缩放
          <button id="zoom-in" aria-label="放大">放大</button>
          <button id="zoom-out" aria-label="缩小">缩小</button>
          <button id="reset">复位</button>
        </span>
      </div>
    </div>

    <div class="layout">
      <aside class="legend">
        <div class="label">节点类别</div>
        <input id="search" type="search" placeholder="查找节点，如：粿" autocomplete="off" />
        <div id="legend"></div>
        <label class="bridge-toggle"><input type="checkbox" id="only-bridges" /><span id="bridge-lbl">只看跨门类关联</span></label>
        <div class="hubs">常用
          <div>
            <button data-id="CY-AF-001">达濠鱼丸</button>
            <button data-id="CY-AF-002">鱼饭</button>
            <button data-id="CY-CR-006">杉木桶与铁匙</button>
            <button data-id="CY-PR-001">侨批</button>
            <button data-id="MOR-GUE">粿</button>
            <button data-id="MOR-PHAH">拍</button>
          </div>
        </div>
      </aside>

      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="kg"></canvas>
        <div class="hover-tip" id="hover-tip"></div>
        <div class="canvas-note">滚轮缩放，拖动画布或节点，点击节点查看它的关联。</div>
      </div>

      <aside class="inspector">
        <div class="type" id="i-type"></div>
        <div class="name" id="i-name"></div>
        <div class="pron" id="i-pron"></div>
        <div class="deg" id="i-deg"></div>
        <div class="acts" id="i-acts"></div>
        <div class="rel-head" id="rel-head">关联</div>
        <div class="rel-list" id="rel-list"></div>
        <details class="cypher">
          <summary>Neo4j 查询语句</summary>
          <pre id="cypher"></pre>
        </details>
      </aside>
    </div>

    <footer class="colophon">
      <div class="colophon-inner">
        <span>汕头大学“潮音博物”课题组　·　研究工具</span>
        <span class="links">
          <a href="index.html">词目</a>
          <a href="experiment.html">对照实验施测页</a>
          <a href="about.html">关于本项目</a>
        </span>
      </div>
    </footer>
  </div>

  <script src="kg_data.js"></script>
  <script>
    (function () {
      var KG = window.CHAOYIN_KG_DATA, m = KG.metrics;
      var $ = function (id) { return document.getElementById(id); };

      // 印刷用的低饱和色，替代原始数据中的高饱和配色
      var PALETTE = {
        CountyUnit: "#16140f",
        Category: "#8a5a2b",
        Street: "#3f5a73",
        AccentPoint: "#5b6b4a",
        NominalItem: "#a8321d",
        KeyMorpheme: "#6a4f6f",
        SpatialSite: "#4f7480",
        PhoneticFeature: "#9a86ab",
        HeritageLevel: "#a0782f",
        CraftAndMaterial: "#7d9467",
        FolkAliasOrTrap: "#b9ab9b"
      };
      KG.nodes.forEach(function (n) { n.c = PALETTE[n.node_type] || "#8a857a"; });

      // 对外显示用的平实名称，原始字段保留在数据文件中
      var TYPE_NAME = {
        CountyUnit: "县域",
        Category: "门类",
        Street: "街道",
        AccentPoint: "口音参照点",
        NominalItem: "风物词条",
        KeyMorpheme: "本字",
        SpatialSite: "村落与展馆",
        PhoneticFeature: "读音特点",
        HeritageLevel: "非遗与文保层级",
        CraftAndMaterial: "工艺与物产",
        FolkAliasOrTrap: "俗称与易错字"
      };
      var REL_NAME = {
        BELONGS_TO_CATEGORY: "属于",
        ANCHORED_AT_SITE: "见于",
        EXHIBITS_PHONETIC_TRAIT: "读音特点",
        INVOLVES_CRAFT_MATERIAL: "涉及",
        CLASSIFIED_AS_HERITAGE: "认定为",
        HAS_F0_CONTOUR_IN_ACCENT: "有声调记录",
        CONTAINS_KEY_MORPHEME: "含本字",
        PART_OF_COUNTY: "属于",
        LOCATED_IN_STREET: "位于",
        CALIBRATES_TO_ORTHOGRAPHY: "俗称归并为",
        TOOL_SUPPORTS_CRAFT: "用于",
        VILLAGE_SPACE_COUPLED: "同村相关",
        QIAOPI_CULTURAL_COUPLED: "侨批文化相关",
        ECOLOGY_GUIDES_LIVELIHOOD: "生态知识相关"
      };
      function typeName(t) { return TYPE_NAME[t] || KG.node_type_catalog[t].zh; }
      function relName(e) { return REL_NAME[e.relation] || e.label; }

      $("kg-sub").textContent = "汕头市濠江区首期　" + m.total_nodes + "个节点　" + m.total_edges_triples + "条关系　其中跨门类关联" + m.cross_category_bridges_count + "条";
      $("bridge-lbl").textContent = "只看跨门类关联（" + m.cross_category_bridges_count + "条）";

      var focus = new URLSearchParams(location.search).get("focus");
      var nodeMap = new Map();
      KG.nodes.forEach(function (n) { nodeMap.set(n.id, n); });
      var selectedId = focus && nodeMap.has(focus) ? focus : "CY-AF-001";
      var hidden = new Set(), onlyBridges = false, term = "", layout = "shell", hovered = null;

      var ringOf = {
        CountyUnit: 0, Category: 1, Street: 1, AccentPoint: 1, NominalItem: 2,
        KeyMorpheme: 3, SpatialSite: 3, PhoneticFeature: 3, HeritageLevel: 3,
        CraftAndMaterial: 4, FolkAliasOrTrap: 4
      };
      var radii = [0, 108, 208, 300, 382];
      var rings = [[], [], [], [], []];
      KG.nodes.forEach(function (n) { rings[ringOf[n.node_type] != null ? ringOf[n.node_type] : 3].push(n); });
      rings.forEach(function (arr, r) {
        arr.sort(function (a, b) { return a.id.localeCompare(b.id); });
        arr.forEach(function (n, i) {
          var th = (2 * Math.PI * i) / Math.max(1, arr.length) + r * 0.17;
          n.sx = radii[r] * Math.cos(th); n.sy = radii[r] * Math.sin(th);
          n.x = n.sx; n.y = n.sy; n.vx = 0; n.vy = 0;
        });
      });

      // 图例
      var lg = $("legend");
      Object.keys(KG.node_type_catalog).forEach(function (t) {
        var b = document.createElement("button");
        b.className = "lg-item";
        b.innerHTML = '<span class="sw" style="background:' + PALETTE[t] + '"></span><span class="nm">' +
          typeName(t) + '</span><span class="ct">' + (m.node_type_breakdown[t] || 0) + "</span>";
        b.addEventListener("click", function () {
          if (hidden.has(t)) hidden.delete(t); else hidden.add(t);
          b.classList.toggle("off", hidden.has(t));
          draw();
        });
        lg.appendChild(b);
      });

      $("only-bridges").addEventListener("change", function (e) { onlyBridges = e.target.checked; draw(); });
      $("search").addEventListener("input", function (e) {
        term = e.target.value.trim().toLowerCase();
        if (term) {
          var h = KG.nodes.find(function (n) {
            return n.label.toLowerCase().indexOf(term) !== -1 || (n.pengim && n.pengim.toLowerCase().indexOf(term) !== -1);
          });
          if (h) select(h.id, false);
        }
        draw();
      });
      Array.prototype.forEach.call(document.querySelectorAll(".hubs button"), function (b) {
        b.addEventListener("click", function () { select(b.dataset.id, true); });
      });

      var wrap = $("canvas-wrap"), cv = $("kg"), ctx = cv.getContext("2d"), tip = $("hover-tip");
      var camX = 0, camY = 0, scale = 0.84, dragNode = null, panning = false, lx = 0, ly = 0;
      function fitScale() {
        return Math.max(0.45, Math.min(0.9, (Math.min(wrap.clientWidth, wrap.clientHeight) / 2 - 36) / 400));
      }

      function resize() {
        var dpr = window.devicePixelRatio || 1;
        cv.width = wrap.clientWidth * dpr;
        cv.height = wrap.clientHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }
      window.addEventListener("resize", resize);

      function toWorld(sx, sy) {
        return { x: (sx - wrap.clientWidth / 2 - camX) / scale, y: (sy - wrap.clientHeight / 2 - camY) / scale };
      }
      function visible(n) {
        if (hidden.has(n.node_type)) return false;
        if (onlyBridges) return KG.edges.some(function (e) { return e.is_cross_bridge && (e.source === n.id || e.target === n.id); });
        return true;
      }
      function rad(n) {
        if (n.node_type === "CountyUnit") return 11;
        if (n.node_type === "NominalItem") return 7.5;
        if (n.node_type === "Category" || n.node_type === "Street") return 6.5;
        return 4.6;
      }
      function hitTest(sx, sy) {
        var w = toWorld(sx, sy);
        for (var i = KG.nodes.length - 1; i >= 0; i--) {
          var n = KG.nodes[i];
          if (visible(n) && Math.hypot(n.x - w.x, n.y - w.y) <= rad(n) + 5) return n;
        }
        return null;
      }

      function relax(steps) {
        var ns = KG.nodes;
        for (var s = 0; s < steps; s++) {
          for (var i = 0; i < ns.length; i++) {
            for (var j = i + 1; j < ns.length; j++) {
              var a = ns[i], b = ns[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy + 60;
              var f = 4400 / d2, d = Math.sqrt(d2);
              a.vx -= (dx / d) * f; a.vy -= (dy / d) * f; b.vx += (dx / d) * f; b.vy += (dy / d) * f;
            }
          }
          KG.edges.forEach(function (e) {
            var a = nodeMap.get(e.source), b = nodeMap.get(e.target);
            if (!a || !b) return;
            var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
            var f = (d - (e.is_cross_bridge ? 185 : 132)) * 0.022;
            a.vx += (dx / d) * f; a.vy += (dy / d) * f; b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
          });
          ns.forEach(function (n) {
            if (n.node_type === "CountyUnit") { n.x = 0; n.y = 0; return; }
            n.vx -= n.x * 0.004; n.vy -= n.y * 0.004;
            n.x += n.vx * 0.34; n.y += n.vy * 0.34; n.vx *= 0.64; n.vy *= 0.64;
          });
        }
      }

      function setLayout(l) {
        layout = l;
        $("lay-shell").classList.toggle("on", l === "shell");
        $("lay-force").classList.toggle("on", l === "force");
        if (l === "shell") KG.nodes.forEach(function (n) { n.x = n.sx; n.y = n.sy; });
        else relax(130);
        draw();
      }
      $("lay-shell").addEventListener("click", function () { setLayout("shell"); });
      $("lay-force").addEventListener("click", function () { setLayout("force"); });
      $("zoom-in").addEventListener("click", function () { scale = Math.min(2.6, scale * 1.18); draw(); });
      $("zoom-out").addEventListener("click", function () { scale = Math.max(0.35, scale * 0.85); draw(); });
      $("reset").addEventListener("click", function () {
        camX = 0; camY = 0; scale = fitScale(); onlyBridges = false; $("only-bridges").checked = false;
        hidden.clear();
        Array.prototype.forEach.call(document.querySelectorAll(".lg-item"), function (b) { b.classList.remove("off"); });
        draw();
      });

      cv.addEventListener("mousedown", function (e) {
        var r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
        lx = mx; ly = my;
        var h = hitTest(mx, my);
        if (h) { dragNode = h; select(h.id, false); } else panning = true;
      });
      window.addEventListener("mousemove", function (e) {
        var r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
        if (dragNode) { var w = toWorld(mx, my); dragNode.x = w.x; dragNode.y = w.y; draw(); return; }
        if (panning) { camX += mx - lx; camY += my - ly; lx = mx; ly = my; draw(); return; }
        if (mx < 0 || my < 0 || mx > r.width || my > r.height) return;
        var h = hitTest(mx, my);
        if (h !== hovered) {
          hovered = h;
          cv.style.cursor = h ? "pointer" : "grab";
          tip.textContent = h ? typeName(h.node_type) + "　" + h.label : "";
        }
      });
      window.addEventListener("mouseup", function () { dragNode = null; panning = false; });
      cv.addEventListener("wheel", function (e) {
        e.preventDefault();
        scale = Math.max(0.35, Math.min(2.6, scale * (e.deltaY < 0 ? 1.12 : 0.89)));
        draw();
      }, { passive: false });

      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

      function select(id, recenter) {
        var n = nodeMap.get(id);
        if (!n) return;
        selectedId = id;
        if (recenter) { camX = -n.x * scale * 0.6; camY = -n.y * scale * 0.6; }
        inspect(n);
        draw();
      }

      function inspect(n) {
        $("i-type").textContent = typeName(n.node_type);
        $("i-name").textContent = n.full_orthography || n.label;
        $("i-pron").innerHTML = n.pengim
          ? '<span class="pengim">' + esc(n.pengim) + '</span><span class="ipa">' + esc(n.ipa || "") + "</span>"
          : "";
        var rel = KG.edges.filter(function (e) { return e.source === n.id || e.target === n.id; });
        $("i-deg").textContent = "关联" + rel.length + "条";
        $("i-acts").innerHTML = n.node_type === "NominalItem"
          ? '<a href="index.html?id=' + n.id + '">查看词条</a><a href="mobile.html?id=' + n.id + '">扫码页</a>'
          : "";
        $("rel-head").textContent = "关联（" + rel.length + "条）";
        var list = $("rel-list");
        list.innerHTML = "";
        rel.forEach(function (e) {
          var s = nodeMap.get(e.source), t = nodeMap.get(e.target);
          var other = e.source === n.id ? e.target : e.source;
          var b = document.createElement("button");
          b.className = "rel" + (e.is_cross_bridge ? " bridge" : "");
          b.title = e.label;
          b.innerHTML = esc(s ? s.label : e.source) + '<span class="r">' + esc(relName(e)) + "</span>" + esc(t ? t.label : e.target);
          b.addEventListener("click", function () { select(other, false); });
          list.appendChild(b);
        });
        $("cypher").textContent = "MATCH (center {id: '" + n.id + "'})-[r]-(neighbor)\nRETURN center, type(r) AS relation, neighbor;";
      }

      function draw() {
        var w = wrap.clientWidth, h = wrap.clientHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.translate(w / 2 + camX, h / 2 + camY);
        ctx.scale(scale, scale);

        if (layout === "shell") {
          ctx.setLineDash([2, 5]);
          ctx.strokeStyle = "rgba(22,20,15,0.12)";
          ctx.lineWidth = 1;
          radii.slice(1).forEach(function (r) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke(); });
          ctx.setLineDash([]);
        }

        var nb = new Set([selectedId]);
        KG.edges.forEach(function (e) {
          if (e.source === selectedId) nb.add(e.target);
          if (e.target === selectedId) nb.add(e.source);
        });

        KG.edges.forEach(function (e) {
          var a = nodeMap.get(e.source), b = nodeMap.get(e.target);
          if (!a || !b || !visible(a) || !visible(b)) return;
          if (onlyBridges && !e.is_cross_bridge) return;
          var on = e.source === selectedId || e.target === selectedId;
          ctx.beginPath();
          if (e.is_cross_bridge) {
            ctx.moveTo(a.x, a.y);
            ctx.quadraticCurveTo((a.x + b.x) / 2 - (b.y - a.y) * 0.18, (a.y + b.y) / 2 + (b.x - a.x) * 0.18, b.x, b.y);
            ctx.strokeStyle = on ? "#a8321d" : "rgba(168,50,29,0.45)";
            ctx.lineWidth = on ? 1.8 : 1;
          } else {
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = on ? "#16140f" : "rgba(22,20,15,0.1)";
            ctx.lineWidth = on ? 1.2 : 0.7;
          }
          ctx.stroke();
        });

        var order = [];
        KG.nodes.forEach(function (n) { if (visible(n) && !nb.has(n.id)) order.push(n); });
        KG.nodes.forEach(function (n) { if (visible(n) && nb.has(n.id) && n.id !== selectedId) order.push(n); });
        var sel = nodeMap.get(selectedId);
        if (sel && visible(sel)) order.push(sel);

        order.forEach(function (n) {
          var r = rad(n), isSel = n.id === selectedId, isNb = nb.has(n.id);
          var match = term && n.label.toLowerCase().indexOf(term) !== -1;
          ctx.globalAlpha = isNb || onlyBridges || match ? 1 : 0.3;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fillStyle = n.c;
          ctx.fill();
          if (isSel || match) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, r + 4, 0, Math.PI * 2);
            ctx.strokeStyle = "#16140f";
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
          var showLabel = isSel || isNb || n.node_type === "CountyUnit" ||
            (layout === "shell" && n.node_type === "NominalItem") || scale > 1.3;
          if (showLabel) {
            ctx.font = (isSel ? "700 13px " : n.node_type === "NominalItem" ? "600 12px " : "400 11px ") +
              "'Noto Serif SC','Songti SC','SimSun',serif";
            ctx.textAlign = "center";
            ctx.lineJoin = "round";
            ctx.strokeStyle = "rgba(251,250,246,0.95)";
            ctx.lineWidth = 4;
            ctx.strokeText(n.label, n.x, n.y + r + 14);
            ctx.fillStyle = isSel ? "#a8321d" : "#16140f";
            ctx.fillText(n.label, n.x, n.y + r + 14);
          }
        });
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      resize();
      scale = fitScale();
      select(selectedId, false);
    })();
  </script>
</body>
</html>
