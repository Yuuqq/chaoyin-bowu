<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>潮音博物 · 汕头濠江方言风物录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
    media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .book {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) 210px;
      gap: 0 60px;
      margin-top: 36px;
      align-items: start;
    }

    /* 词目索引 */
    .index {
      position: sticky;
      top: 22px;
      max-height: calc(100vh - 44px);
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
    }

    .idx-details>summary {
      display: none;
    }

    .lookup {
      width: 100%;
      margin-top: 10px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
      padding: 6px 0;
      font-family: var(--serif);
      font-size: 15px;
      outline: none;
    }

    .lookup::placeholder {
      color: var(--ink-3);
    }

    .lookup-msg {
      font-family: var(--sans);
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--ink-3);
      margin-top: 8px;
    }

    .lookup-msg:empty {
      display: none;
    }

    .lookup-msg.miss {
      color: var(--red);
    }

    .idx-mode {
      display: flex;
      gap: 14px;
      margin-top: 16px;
      font-family: var(--sans);
      font-size: 13px;
    }

    .idx-mode button {
      background: none;
      border: 0;
      padding: 0 0 2px;
      cursor: pointer;
      color: var(--ink-3);
      border-bottom: 1px solid transparent;
    }

    .idx-mode button.on {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .idx-group h3 {
      margin: 22px 0 4px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--hair);
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--ink-3);
    }

    .idx-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 3px 0;
      font-size: 15px;
      color: var(--ink-2);
    }

    .idx-item .w {
      white-space: nowrap;
    }

    .idx-item .lead {
      flex: 1;
      min-width: 12px;
      border-bottom: 1px dotted rgba(22, 20, 15, 0.3);
      transform: translateY(-4px);
    }

    .idx-item .n {
      font-family: var(--latin);
      font-size: 13px;
      color: var(--ink-3);
    }

    .idx-item:hover {
      color: var(--ink);
    }

    .idx-item.on,
    .idx-item.on .n {
      color: var(--red);
    }

    .entry {
      max-width: 660px;
      min-width: 0;
    }

    .margin {
      position: sticky;
      top: 22px;
      padding-top: 4px;
    }

    @media (max-width: 1100px) {
      .book {
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 0 44px;
      }

      .margin {
        position: static;
        grid-column: 2;
        margin-top: 36px;
        padding-top: 20px;
        border-top: 1px solid var(--hair);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 36px;
      }
    }

    @media (max-width: 760px) {
      .book {
        grid-template-columns: 1fr;
        margin-top: 18px;
      }

      .index {
        position: static;
        max-height: none;
        overflow: visible;
        border-bottom: 1px solid var(--hair);
        padding: 0 0 8px;
        margin-bottom: 26px;
      }

      .idx-details>summary {
        display: flex;
        justify-content: space-between;
        cursor: pointer;
        list-style: none;
        font-family: var(--sans);
        font-size: 14px;
        padding: 6px 0;
      }

      .idx-details>summary::-webkit-details-marker {
        display: none;
      }

      .margin {
        grid-column: 1;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="masthead">
        <a class="wordmark" href="index.html">
          <span class="seal" aria-hidden="true">潮音</span>
          <span class="wm-text">
            <span class="wm-title">潮音博物</span>
            <span class="wm-sub">汕头濠江方言风物录</span>
          </span>
        </a>
        <nav class="topnav">
          <a class="on" href="index.html">词目</a>
          <a href="about.html">关于本项目</a>
        </nav>
      </div>
      <div class="rules"></div>
    </header>

    <div class="book">
      <aside class="index">
        <details class="idx-details" id="idx-details" open>
          <summary><span>词目</span><span id="idx-sum-count"></span></summary>
          <div class="label">词目</div>
          <input class="lookup" id="lookup" type="search" placeholder="查词，如：鱼饭" autocomplete="off" />
          <div class="lookup-msg" id="lookup-msg"></div>
          <div class="idx-mode">
            <button data-mode="cat" class="on">按门类</button>
            <button data-mode="site">按地点</button>
          </div>
          <nav id="idx-list"></nav>
        </details>
      </aside>

      <article class="entry">
        <div class="kicker"><span class="no" id="e-no"></span>　<span id="e-cat"></span></div>
        <h1 class="headword" id="e-word"></h1>
        <div class="pron">
          <span class="pengim" id="e-pengim"></span>
          <span class="ipa" id="e-ipa"></span>
        </div>
        <div class="listen">
          <button class="textbtn" id="play-guide" type="button" data-stop-label="■ 停止解说">▶ 听词条解说</button>
          <button class="textbtn" id="play-hj" type="button" data-stop-label="■ 停止">▶ 读音与声调 · 濠江</button>
          <button class="textbtn quiet" id="play-st" type="button" data-stop-label="■ 停止">▶ 读音与声调 · 市区</button>
        </div>

        <hr class="hair" />
        <p class="para"><b>俗称</b><span id="e-alias"></span></p>
        <p class="para"><b>音韵</b><span id="e-accent"></span></p>
        <p class="para"><b>形制与做法</b><span id="e-desc"></span></p>

        <figure class="tone-fig">
          <svg id="tone" role="img" aria-label="声调走势图"></svg>
          <figcaption>声调走势，按五度标调法绘制，纵轴一度最低、五度最高。朱色实线为濠江口音，灰色虚线为汕头市区口音。词条解说为合成语音，两处读音按国际音标与五度走势合成，均非田野真人录音。</figcaption>
        </figure>

        <p class="note"><span class="note-mark">注</span><span id="e-trap"></span></p>

        <nav class="pager">
          <a id="prev" href="#"><span class="dir">上一条</span><span class="pw" id="prev-w"></span></a>
          <a id="next" class="next" href="#"><span class="dir">下一条</span><span class="pw" id="next-w"></span></a>
        </nav>
      </article>

      <aside class="margin">
        <dl class="meta">
          <dt>档案号</dt>
          <dd class="mono" id="m-id"></dd>
          <dt>导览牌编号</dt>
          <dd class="mono" id="m-qr"></dd>
          <dt>认定与类别</dt>
          <dd id="m-heritage"></dd>
          <dt>所在</dt>
          <dd id="m-site"></dd>
        </dl>
        <div>
          <figure class="locator">
            <svg id="locator" role="img" aria-label="点位示意图"></svg>
            <figcaption>濠江区点位示意，按实测经纬度落点。</figcaption>
          </figure>
          <div class="side-links">
            <a id="m-mobile" href="mobile.html">导览牌扫码页 →</a>
            <a id="m-graph" href="graph.html">在知识图谱中查看 →</a>
          </div>
        </div>
      </aside>
    </div>

    <footer class="colophon">
      <div class="colophon-inner">
        <span>汕头大学“潮音博物”课题组　·　濠江方言风物录　首期</span>
        <span class="links">
          <a href="about.html">关于本项目</a>
          <a href="graph.html">知识图谱</a>
          <a href="experiment.html">对照实验施测页</a>
          <a href="schema/chaoyin_nominal_schema_v1.json">数据规范</a>
        </span>
      </div>
    </footer>
  </div>

  <script src="./seed_data.js"></script>
  <script src="./app.js"></script>
  <script>
    (function () {
      var CY = window.CY, items = CY.items;
      if (!items.length) return;
      var $ = function (id) { return document.getElementById(id); };
      var params = new URLSearchParams(location.search);
      var cur = items.find(function (x) { return x.id === params.get("id"); }) || items[0];
      var mode = "cat", query = "";

      $("idx-sum-count").textContent = "共" + items.length + "条";

      function groups() {
        if (mode === "cat") {
          return CY.CAT_ORDER.map(function (c) {
            return { title: CY.catShort(c), list: items.filter(function (i) { return i.category === c; }) };
          });
        }
        return CY.SITES.map(function (s) {
          return { title: s.street + "　" + s.name, list: items.filter(function (i) { return CY.siteOf(i) === s; }) };
        });
      }

      function hit(it, q) {
        q = q.toLowerCase();
        return [it.orthography, it.folk_alias, it.pengim_shantou, it.site_village, it.site_street]
          .some(function (f) { return f.toLowerCase().indexOf(q) !== -1; });
      }

      function renderIndex() {
        var q = query.trim(), n = 0, html = "";
        groups().forEach(function (g) {
          var list = q ? g.list.filter(function (i) { return hit(i, q); }) : g.list;
          if (!list.length) return;
          n += list.length;
          html += '<section class="idx-group"><h3>' + g.title + "</h3>" + list.map(function (i) {
            return '<a class="idx-item' + (i === cur ? " on" : "") + '" href="?id=' + i.id + '" data-id="' + i.id + '">' +
              '<span class="w">' + CY.shortName(i.orthography) + '</span><span class="lead"></span>' +
              '<span class="n">' + (items.indexOf(i) + 1) + "</span></a>";
          }).join("") + "</section>";
        });
        $("idx-list").innerHTML = html;

        var msg = $("lookup-msg");
        if (!q) { msg.textContent = ""; msg.className = "lookup-msg"; }
        else if (n) { msg.textContent = "找到" + n + "条。"; msg.className = "lookup-msg"; }
        else {
          msg.textContent = "本录尚未收录“" + q + "”。现收的" + items.length + "条均经课题组核对，未经核实的词语不作解释。";
          msg.className = "lookup-msg miss";
        }

        Array.prototype.forEach.call($("idx-list").querySelectorAll(".idx-item"), function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            select(items.find(function (x) { return x.id === a.dataset.id; }));
            if (window.innerWidth <= 760) {
              $("idx-details").open = false;
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        });
      }

      function setPager(a, it) {
        if (!it) { a.style.visibility = "hidden"; return; }
        a.style.visibility = "visible";
        a.href = "?id=" + it.id;
        a.querySelector(".pw").textContent = CY.shortName(it.orthography);
        a.onclick = function (e) { e.preventDefault(); select(it); window.scrollTo({ top: 0, behavior: "smooth" }); };
      }

      function renderEntry(it) {
        var n = items.indexOf(it) + 1;
        $("e-no").textContent = "第" + CY.cnNum(n) + "条";
        $("e-cat").textContent = CY.catShort(it.category);
        $("e-word").textContent = it.orthography;
        $("e-pengim").textContent = it.pengim_shantou;
        $("e-ipa").textContent = it.ipa_shantou;
        $("e-alias").textContent = it.folk_alias;
        $("e-accent").textContent = it.haojiang_accent_note;
        $("e-desc").textContent = it.artifact_desc;
        $("e-trap").textContent = "常见误读　" + it.llm_hallucination_trap;
        CY.drawTone($("tone"), it);

        $("m-id").textContent = it.id;
        $("m-qr").textContent = "QR-HJ-" + it.id.slice(-3);
        $("m-heritage").textContent = it.heritage_tag;
        $("m-site").innerHTML = CY.esc(it.site_street) + "<br>" + CY.esc(it.site_village) +
          '<br><span class="mono">' + it.lat.toFixed(4) + "°N　" + it.lng.toFixed(4) + "°E</span>";
        CY.drawLocator($("locator"), it);
        $("m-mobile").href = "mobile.html?id=" + it.id;
        $("m-graph").href = "graph.html?focus=" + it.id;

        setPager($("prev"), items[n - 2]);
        setPager($("next"), items[n]);
        document.title = it.orthography + " · 潮音博物";
      }

      function select(it) {
        if (!it) return;
        CY.stopAudio();
        cur = it;
        var url = new URL(location.href);
        url.searchParams.set("id", it.id);
        history.replaceState({}, "", url.toString());
        renderIndex();
        renderEntry(it);
      }

      $("play-guide").addEventListener("click", function () {
        CY.playClip({ kind: "guide", item: cur, btn: $("play-guide") });
      });
      $("play-hj").addEventListener("click", function () {
        CY.playClip({ kind: "hj", item: cur, svg: $("tone"), seq: cur.f0_contour_haojiang, baseHz: 192, color: "#a8321d", btn: $("play-hj") });
      });
      $("play-st").addEventListener("click", function () {
        CY.playClip({ kind: "st", item: cur, svg: $("tone"), seq: cur.f0_contour_shantou, baseHz: 192, color: "#8a857a", btn: $("play-st") });
      });

      Array.prototype.forEach.call(document.querySelectorAll(".idx-mode button"), function (b) {
        b.addEventListener("click", function () {
          mode = b.dataset.mode;
          Array.prototype.forEach.call(document.querySelectorAll(".idx-mode button"), function (x) {
            x.classList.toggle("on", x === b);
          });
          renderIndex();
        });
      });

      $("lookup").addEventListener("input", function (e) { query = e.target.value; renderIndex(); });
      $("lookup").addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        var first = $("idx-list").querySelector(".idx-item");
        if (first && query.trim()) select(items.find(function (x) { return x.id === first.dataset.id; }));
      });

      document.addEventListener("keydown", function (e) {
        if (e.target.tagName === "INPUT") return;
        var n = items.indexOf(cur);
        if (e.key === "ArrowRight" && items[n + 1]) select(items[n + 1]);
        if (e.key === "ArrowLeft" && items[n - 1]) select(items[n - 1]);
      });

      function syncDetails() { if (window.innerWidth > 760) $("idx-details").open = true; }
      if (window.innerWidth <= 760) $("idx-details").open = false;
      window.addEventListener("resize", syncDetails);

      renderIndex();
      renderEntry(cur);
    })();
  </script>
</body>

</html>
