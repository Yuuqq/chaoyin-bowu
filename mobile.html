<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>潮音博物 · 濠江方言风物</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .page { max-width: 560px; margin: 0 auto; }
    .entry { margin-top: 26px; }
    .meta-block {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--hair);
    }
    .meta-block .meta { display: grid; grid-template-columns: 5.5em 1fr; gap: 0 12px; }
    .meta-block .meta dt { padding-top: 3px; }
    .meta-block .meta dd { margin: 0 0 14px; }
    .same-site { margin-top: 36px; }
    .same-site h2 {
      margin: 0 0 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--rule);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--ink-3);
    }
    .same-site a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--hair);
      font-size: 16px;
    }
    .same-site a .py { font-family: var(--latin); font-size: 13.5px; color: var(--ink-3); white-space: nowrap; }
    .same-site a:hover { color: var(--red); }
    .all-link {
      display: inline-block;
      margin-top: 16px;
      font-family: var(--sans);
      font-size: 13.5px;
      color: var(--red);
      border-bottom: 1px solid rgba(168, 50, 29, 0.35);
    }
  </style>
</head>
<body>
  <div class="wrap page">
    <header>
      <div class="masthead">
        <a class="wordmark" href="index.html">
          <span class="seal" aria-hidden="true">潮音</span>
          <span class="wm-text">
            <span class="wm-title">潮音博物</span>
            <span class="wm-sub">汕头濠江方言风物录</span>
          </span>
        </a>
        <nav class="topnav">
          <a id="to-index" href="index.html">全部词目</a>
        </nav>
      </div>
      <div class="rules"></div>
    </header>

    <article class="entry">
      <div class="kicker"><span class="no" id="e-no"></span>　<span id="e-cat"></span>　<span id="e-place"></span></div>
      <h1 class="headword" id="e-word"></h1>
      <div class="pron">
        <span class="pengim" id="e-pengim"></span>
        <span class="ipa" id="e-ipa"></span>
      </div>
      <div class="listen">
        <button class="textbtn" id="play-hj">▶ 听声调　濠江口音</button>
        <button class="textbtn quiet" id="play-st">▶ 汕头市区口音</button>
      </div>

      <figure class="tone-fig">
        <svg id="tone" role="img" aria-label="声调走势图"></svg>
        <figcaption>声调走势（五度标调）。朱色为濠江口音，灰色为市区口音。示意音按走势合成，并非真人录音。</figcaption>
      </figure>

      <hr class="hair" />
      <p class="para"><b>俗称</b><span id="e-alias"></span></p>
      <p class="para"><b>音韵</b><span id="e-accent"></span></p>
      <p class="para"><b>形制与做法</b><span id="e-desc"></span></p>
      <p class="note"><span class="note-mark">注</span><span id="e-trap"></span></p>

      <div class="meta-block">
        <dl class="meta">
          <dt>所在</dt><dd id="m-site"></dd>
          <dt>认定与类别</dt><dd id="m-heritage"></dd>
          <dt>档案号</dt><dd class="mono" id="m-id"></dd>
        </dl>
        <figure class="locator">
          <svg id="locator" role="img" aria-label="点位示意图"></svg>
          <figcaption>濠江区点位示意，按实测经纬度落点。</figcaption>
        </figure>
      </div>

      <section class="same-site" id="same-site"></section>
      <a class="all-link" id="all-link" href="index.html">查看全部词目 →</a>

      <nav class="pager">
        <a id="prev" href="#"><span class="dir">上一条</span><span class="pw"></span></a>
        <a id="next" class="next" href="#"><span class="dir">下一条</span><span class="pw"></span></a>
      </nav>
    </article>

    <footer class="colophon">
      <div class="colophon-inner">
        <span>汕头大学“潮音博物”课题组</span>
        <span class="links"><a href="about.html">关于本项目</a></span>
      </div>
    </footer>
  </div>

  <script src="./seed_data.js"></script>
  <script src="./app.js"></script>
  <script>
    (function () {
      var CY = window.CY, items = CY.items;
      if (!items.length) return;
      var $ = function (id) { return document.getElementById(id); };
      var cur = items.find(function (x) { return x.id === new URLSearchParams(location.search).get("id"); }) || items[0];

      function go(it) {
        cur = it;
        var url = new URL(location.href);
        url.searchParams.set("id", it.id);
        history.replaceState({}, "", url.toString());
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function setPager(a, it) {
        if (!it) { a.style.visibility = "hidden"; return; }
        a.style.visibility = "visible";
        a.href = "?id=" + it.id;
        a.querySelector(".pw").textContent = CY.shortName(it.orthography);
        a.onclick = function (e) { e.preventDefault(); go(it); };
      }

      function render() {
        var it = cur, n = items.indexOf(it) + 1, site = CY.siteOf(it);
        $("e-no").textContent = "第" + CY.cnNum(n) + "条";
        $("e-cat").textContent = CY.catShort(it.category);
        $("e-place").textContent = site ? site.name : CY.villageShort(it.site_village);
        $("e-word").textContent = it.orthography;
        $("e-pengim").textContent = it.pengim_shantou;
        $("e-ipa").textContent = it.ipa_shantou;
        $("e-alias").textContent = it.folk_alias;
        $("e-accent").textContent = it.haojiang_accent_note;
        $("e-desc").textContent = it.artifact_desc;
        $("e-trap").textContent = "常见误读　" + it.llm_hallucination_trap;
        CY.drawTone($("tone"), it, { w: 360, h: 132, padL: 18, padR: 34, font: 10 });

        $("m-site").innerHTML = "汕头市濠江区" + CY.esc(it.site_street) + "<br>" + CY.esc(it.site_village) +
          '<br><span class="mono">' + it.lat.toFixed(4) + "°N　" + it.lng.toFixed(4) + "°E</span>";
        $("m-heritage").textContent = it.heritage_tag;
        $("m-id").textContent = it.id;
        CY.drawLocator($("locator"), it);

        var others = items.filter(function (x) { return x !== it && CY.siteOf(x) === site; });
        $("same-site").innerHTML = others.length
          ? "<h2>同在" + (site ? site.name : "此地") + "的风物</h2>" + others.map(function (x) {
              return '<a href="?id=' + x.id + '" data-id="' + x.id + '"><span>' + CY.shortName(x.orthography) +
                '</span><span class="py">' + CY.esc(x.pengim_shantou) + "</span></a>";
            }).join("")
          : "";
        Array.prototype.forEach.call($("same-site").querySelectorAll("a"), function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            go(items.find(function (x) { return x.id === a.dataset.id; }));
          });
        });

        $("all-link").href = "index.html?id=" + it.id;
        $("to-index").href = "index.html?id=" + it.id;
        setPager($("prev"), items[n - 2]);
        setPager($("next"), items[n]);
        document.title = it.orthography + " · 潮音博物";
      }

      $("play-hj").addEventListener("click", function () { CY.playTone($("tone"), cur.f0_contour_haojiang, 170, "#a8321d"); });
      $("play-st").addEventListener("click", function () { CY.playTone($("tone"), cur.f0_contour_shantou, 180, "#8a857a"); });

      render();
    })();
  </script>
</body>
</html>
