<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课堂对照实验施测页 · 潮音博物</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .form { max-width: 820px; margin: 44px auto 0; }
    .form h1 { margin: 0; font-size: clamp(28px, 4vw, 38px); font-weight: 700; letter-spacing: 0.05em; line-height: 1.3; }
    .form .status {
      display: inline-block;
      margin-top: 10px;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 0 6px;
      letter-spacing: 0.08em;
    }
    .lede { font-size: 16px; line-height: 1.95; text-align: justify; color: var(--ink-2); margin: 18px 0 0; }

    .sec { margin-top: 48px; }
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule);
    }
    .sec-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }
    .sec-head .aside { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); }

    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 32px; margin-top: 20px; }
    .fields .wide { grid-column: 1 / -1; }
    .fld { display: flex; flex-direction: column; gap: 4px; }
    .fld span { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); letter-spacing: 0.06em; }
    .fld input, .fld select {
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
      padding: 6px 0;
      font-size: 15.5px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .fld select {
      background-image: linear-gradient(45deg, transparent 50%, #48443c 50%), linear-gradient(135deg, #48443c 50%, transparent 50%);
      background-position: calc(100% - 10px) 55%, calc(100% - 5px) 55%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      padding-right: 22px;
    }
    .btn {
      display: inline-block;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      padding: 8px 22px;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 14px;
      letter-spacing: 0.06em;
    }
    .btn:hover { background: var(--red); border-color: var(--red); }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn.ghost:hover { color: var(--paper); background: var(--ink); border-color: var(--ink); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 22px; }

    .assign { margin-top: 22px; padding: 14px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
    .assign .who { font-size: 17px; font-weight: 700; }
    .assign .who .g { color: var(--red); }
    .assign .what { font-size: 14.5px; color: var(--ink-2); line-height: 1.8; margin-top: 4px; }
    .preview { margin-top: 10px; font-family: var(--sans); font-size: 13px; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .preview button {
      background: none;
      border: 0;
      padding: 0 0 2px;
      cursor: pointer;
      color: var(--ink-2);
      border-bottom: 1px solid transparent;
    }
    .preview button.on { color: var(--ink); border-bottom-color: var(--ink); }

    .stim { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
    .stim-item { padding: 20px 0; border-bottom: 1px solid var(--hair); }
    .stim-item .k { font-family: var(--sans); font-size: 12px; color: var(--ink-3); letter-spacing: 0.1em; }
    .stim-item .w { font-size: 24px; font-weight: 700; letter-spacing: 0.04em; margin: 2px 0 6px; line-height: 1.3; }
    .stim-item .pron { gap: 2px 16px; margin-bottom: 6px; }
    .stim-item .pengim { font-size: 17px; }
    .stim-item .ipa { font-size: 14px; }
    .stim-item svg { display: block; width: 100%; height: auto; margin: 6px 0 4px; }
    .stim-item p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.85; color: var(--ink-2); text-align: justify; }
    .stim-item p b { color: var(--ink); margin-right: 0.6em; }
    .stim-item .masked { font-family: var(--sans); font-size: 12px; color: var(--ink-3); margin-top: 8px; }

    .quiz { list-style: none; margin: 0; padding: 0; counter-reset: q; }
    .q { padding: 20px 0 18px 40px; border-bottom: 1px solid var(--hair); position: relative; }
    .q::before {
      counter-increment: q;
      content: counter(q);
      position: absolute;
      left: 0;
      top: 18px;
      font-family: var(--latin);
      font-size: 22px;
      color: var(--ink-3);
    }
    .q .tag { font-family: var(--sans); font-size: 12px; color: var(--ink-3); letter-spacing: 0.1em; }
    .q .stem { font-size: 16px; line-height: 1.85; margin: 2px 0 10px; }
    .q .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
    .q label { display: flex; gap: 8px; align-items: baseline; font-size: 15px; line-height: 1.7; cursor: pointer; color: var(--ink-2); }
    .q label:hover { color: var(--ink); }
    .q input { accent-color: var(--ink); transform: translateY(1px); }
    .q .mark { position: absolute; right: 0; top: 20px; font-family: var(--sans); font-size: 13px; }
    .q.ok .mark { color: var(--ink-2); }
    .q.bad .mark { color: var(--red); }
    .q.bad::before { color: var(--red); }

    .result { margin-top: 24px; display: none; }
    .result .score { font-size: 22px; font-weight: 700; }
    .result p { font-size: 14.5px; line-height: 1.9; color: var(--ink-2); margin: 6px 0 0; }
    .result code { font-family: Consolas, monospace; font-size: 13px; }

    @media (max-width: 760px) {
      .fields, .stim, .q .opts { grid-template-columns: 1fr; }
      .q { padding-left: 30px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="masthead">
        <a class="wordmark" href="index.html">
          <span class="seal" aria-hidden="true">潮音</span>
          <span class="wm-text">
            <span class="wm-title">潮音博物</span>
            <span class="wm-sub">汕头濠江方言风物录</span>
          </span>
        </a>
        <nav class="topnav">
          <span class="crumb">研究工具</span>
          <a href="index.html">词目</a>
          <a href="about.html">关于本项目</a>
        </nav>
      </div>
      <div class="rules"></div>
    </header>

    <main class="form">
      <h1>课堂对照实验施测页</h1>
      <span class="status">样例　尚未正式施测</span>
      <p class="lede">本页为立项后在濠江中小学开展的对照实验准备。学生按学段和家里说潮汕话的多少分层后，随机分入三组，分别学习同样六个词的不同材料，学完立即作答八道题，七天后再答一次同构试题，用来比较哪种材料记得更牢。页面只记录匿名编号，不收集姓名和学号。</p>

      <section class="sec">
        <div class="sec-head"><h2>一　登记与分组</h2><span class="aside">按学段与家庭语言环境分层，随机分入三组</span></div>
        <div class="fields">
          <label class="fld">
            <span>匿名编号</span>
            <input id="subj-id" type="text" value="HJ-RCT-018" />
          </label>
          <label class="fld">
            <span>学段</span>
            <select id="grade-band">
              <option value="G5_6">小学五至六年级</option>
              <option value="G7_9" selected>初中七至九年级</option>
            </select>
          </label>
          <label class="fld wide">
            <span>家里说潮汕话的情况</span>
            <select id="home-exp">
              <option value="LOW">很少：家里基本说普通话，只听得懂零星几句</option>
              <option value="MID" selected>一般：长辈说潮汕话能听懂，自己较少开口</option>
              <option value="HIGH">经常：家里日常就用潮汕话交流</option>
            </select>
          </label>
        </div>
        <div class="row"><button class="btn" id="btn-assign">随机分组</button></div>

        <div class="assign">
          <div class="who">分入：<span class="g" id="arm-name"></span></div>
          <div class="what" id="arm-desc"></div>
          <div class="preview">预览各组材料
            <button data-arm="Arm1">第一组</button>
            <button data-arm="Arm2">第二组</button>
            <button data-arm="Arm3">第三组</button>
          </div>
        </div>
      </section>

      <section class="sec">
        <div class="sec-head"><h2>二　学习材料</h2><span class="aside" id="telemetry"></span></div>
        <div class="stim" id="stim"></div>
      </section>

      <section class="sec">
        <div class="sec-head"><h2>三　测验</h2><span class="aside">共八题，即时测验与七天后复测使用同构试题</span></div>
        <ol class="quiz" id="quiz"></ol>
        <div class="row">
          <button class="btn" id="btn-submit">交卷</button>
          <button class="btn ghost" id="btn-csv" style="display:none;">下载本次记录（CSV）</button>
        </div>
        <div class="result" id="result"></div>
      </section>
    </main>

    <footer class="colophon">
      <div class="colophon-inner">
        <span>汕头大学“潮音博物”课题组　·　研究工具</span>
        <span class="links">
          <a href="index.html">词目</a>
          <a href="graph.html">知识图谱</a>
          <a href="about.html">关于本项目</a>
        </span>
      </div>
    </footer>
  </div>

  <script src="seed_data.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var CY = window.CY, seeds = CY.items;
      var $ = function (id) { return document.getElementById(id); };
      var targetIds = ["CY-AF-001", "CY-AF-002", "CY-CR-001", "CY-CR-005", "CY-PR-002", "CY-PR-006"];
      var stimItems = targetIds.map(function (id) { return seeds.find(function (s) { return s.id === id; }); }).filter(Boolean);

      var ARMS = {
        Arm1: { name: "第一组　普通话图文组（对照组）", desc: "只看普通话写的器物简介。不提供潮汕读音、声调图和地点。" },
        Arm2: { name: "第二组　方言读音组", desc: "只看词语的潮拼、国际音标，可以听声调示意音。不提供做法说明、俗称辨误和地点。" },
        Arm3: { name: "第三组　完整词条组", desc: "看到完整词条：俗称辨误、潮拼与国际音标、声调图与示意音、音韵与做法说明、所在地点。" }
      };

      var QUIZ = [
        { tag: "熟语本义", q: "海内外潮人常说的“胶己人”（ga¹-gī⁷-nâng⁵），在侨乡互助传统中是什么意思？",
          opts: ["橡胶手艺人", "自家人，同乡亲友之间的信任认同", "远洋船员", "集市商贩"], ans: 1 },
        { tag: "名物本义", q: "达濠渔港的“鱼饭”（hî⁵-bng¹）是怎样一种食物？",
          opts: ["海鱼肉切丁盖在白米饭上", "鱼浆混糯米粉蒸成的糕", "竹篓装本港海鱼，用粗盐水猛火煮熟后放凉当饭吃", "生鱼片配白粥"], ans: 2 },
        { tag: "动作语素", q: "达濠鱼丸制作中，“拍鱼丸”（phah⁴ hî⁵-uân⁵）的“拍”指的是哪道工序？",
          opts: ["在杉木桶里用手掌反复摔打鱼浆上千次，直到起胶", "用木槌把鱼肉敲成薄片", "给做好的鱼丸拍照", "用机器高速搅碎草鱼肉"], ans: 0 },
        { tag: "器物专名", q: "潮州工夫茶里，潮汕话通常把冲茶的小壶叫什么？",
          opts: ["茶盅（dê⁵-zong¹）", "茶瓶或冲罐（dê⁵-pâng⁵ / chong¹-guang³）", "水鼎（zui²-diang²）", "茶瓯（dê⁵-au¹）"], ans: 1 },
        { tag: "声母特点", q: "蜈田村“木粿印”（bhêk⁸-guê²-ing³）开头的 bh- [b]，是潮汕话保留的哪类声母？",
          opts: ["卷舌擦音", "唇齿清擦音", "古浊双唇塞音", "舌尖边音"], ans: 2 },
        { tag: "生态俗谚", q: "濠江渔谚“讨海人睇流水”（tô²-hai²-nâng⁵ toi³ lâu⁵-zui²）中，“睇”和“流水”分别指什么？",
          opts: ["“睇”是看，“流水”是海潮涨落的规律", "“睇”是记，“流水”是渔船的账目", "“睇”是听，“流水”是山涧溪水", "“睇”是等，“流水”是淡水补给"], ans: 0 },
        { tag: "地点", q: "侨批和工夫茶器物的样本，主要采自濠江区哪个社区？",
          opts: ["礐石街道红光村", "广澳街道东湖社区（东湖侨村）", "达濠街道青篮街", "马滘街道凤岗古村"], ans: 1 },
        { tag: "求证态度", q: "遇到资料里没有记载的器物名，比如“青石双耳滤卤漏斗”，应当怎么做？",
          opts: ["按普通话读音推测潮汕读法", "找个字形相近的成语来解释", "说明暂未找到可靠记录，不凭空编造读音和做法", "用谐音字编一个民间传说"], ans: 2 }
      ];

      var currentArm = "Arm3", audioClicks = 0, startTs = Date.now(), lastCsv = "";

      setInterval(function () {
        $("telemetry").textContent = "已播放声调" + audioClicks + "次　已学习" + Math.floor((Date.now() - startTs) / 1000) + "秒";
      }, 1000);

      function hashCode(str) {
        var h = 2166136261;
        for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
        return Math.abs(h);
      }

      function setArm(k) {
        currentArm = k;
        $("arm-name").textContent = ARMS[k].name;
        $("arm-desc").textContent = ARMS[k].desc;
        Array.prototype.forEach.call(document.querySelectorAll(".preview button"), function (b) {
          b.classList.toggle("on", b.dataset.arm === k);
        });
        renderStim();
      }

      $("btn-assign").addEventListener("click", function () {
        var sid = $("subj-id").value.trim() || "ANON";
        var idx = hashCode(sid + "|" + $("grade-band").value + "|" + $("home-exp").value) % 3;
        startTs = Date.now();
        audioClicks = 0;
        setArm(["Arm1", "Arm2", "Arm3"][idx]);
      });
      Array.prototype.forEach.call(document.querySelectorAll(".preview button"), function (b) {
        b.addEventListener("click", function () { setArm(b.dataset.arm); });
      });

      function renderStim() {
        var box = $("stim");
        box.innerHTML = "";
        stimItems.forEach(function (it, i) {
          var el = document.createElement("div");
          el.className = "stim-item";
          var h = '<div class="k">' + CY.cnNum(i + 1) + "　" + CY.catShort(it.category) + '</div><div class="w">' + CY.esc(it.orthography) + "</div>";
          var pron = '<div class="pron"><span class="pengim">' + CY.esc(it.pengim_shantou) + '</span><span class="ipa">' + CY.esc(it.ipa_shantou) + "</span></div>";
          var play = '<button class="textbtn" data-id="' + it.id + '">▶ 听声调</button>';
          if (currentArm === "Arm1") {
            h += "<p>" + CY.esc(it.artifact_desc) + "</p>";
            h += '<div class="masked">本组不提供读音、声调图和地点</div>';
          } else if (currentArm === "Arm2") {
            h += pron + play;
            h += '<div class="masked">本组不提供做法说明、俗称辨误和地点</div>';
          } else {
            h += pron + '<svg data-tone="' + it.id + '"></svg>' + play;
            h += "<p><b>俗称</b>" + CY.esc(it.folk_alias) + "</p>";
            h += "<p><b>音韵</b>" + CY.esc(it.haojiang_accent_note) + "</p>";
            h += "<p><b>做法</b>" + CY.esc(it.artifact_desc) + "</p>";
            h += "<p><b>所在</b>濠江区" + CY.esc(it.site_street) + CY.esc(CY.villageShort(it.site_village)) + "</p>";
          }
          el.innerHTML = h;
          box.appendChild(el);
          var svg = el.querySelector("svg[data-tone]");
          if (svg) CY.drawTone(svg, it, { w: 360, h: 96, padL: 16, padR: 34, padT: 10, padB: 8, font: 10 });
        });
        Array.prototype.forEach.call(box.querySelectorAll("button[data-id]"), function (b) {
          b.addEventListener("click", function () {
            var it = seeds.find(function (s) { return s.id === b.dataset.id; });
            audioClicks++;
            CY.playTone(b.parentNode.querySelector("svg[data-tone]"), it.f0_contour_haojiang, 170, "#a8321d");
          });
        });
      }

      var qList = $("quiz");
      QUIZ.forEach(function (item, qi) {
        var li = document.createElement("li");
        li.className = "q";
        li.id = "q-" + qi;
        li.innerHTML = '<div class="tag">' + item.tag + '</div><div class="stem">' + item.q + '</div><div class="opts">' +
          item.opts.map(function (o, oi) {
            return '<label><input type="radio" name="q_' + qi + '" value="' + oi + '" /><span>' + "ABCD"[oi] + "　" + o + "</span></label>";
          }).join("") + '</div><span class="mark"></span>';
        qList.appendChild(li);
      });

      $("btn-submit").addEventListener("click", function () {
        var correct = 0, answered = 0;
        QUIZ.forEach(function (item, qi) {
          var li = $("q-" + qi), sel = document.querySelector('input[name="q_' + qi + '"]:checked');
          li.classList.remove("ok", "bad");
          var mark = li.querySelector(".mark");
          if (sel) {
            answered++;
            if (Number(sel.value) === item.ans) { correct++; li.classList.add("ok"); mark.textContent = "对"; }
            else { li.classList.add("bad"); mark.textContent = "错，应选" + "ABCD"[item.ans]; }
          } else { li.classList.add("bad"); mark.textContent = "未答，应选" + "ABCD"[item.ans]; }
        });
        var dwell = Math.floor((Date.now() - startTs) / 1000);
        var pct = ((correct / QUIZ.length) * 100).toFixed(1);
        var sid = $("subj-id").value.trim() || "ANON";
        var grd = $("grade-band").value, exp = $("home-exp").value;
        lastCsv = [
          "subject_id,timestamp_utc,grade_stratum,home_dialect_exposure,assigned_arm,dwell_seconds,f0_synth_clicks,answered_count,correct_count,accuracy_pct",
          [sid, new Date().toISOString(), grd, exp, currentArm, dwell, audioClicks, answered, correct, pct].join(",")
        ].join("\n");
        var r = $("result");
        r.style.display = "block";
        r.innerHTML = '<div class="score">答对' + correct + "题，共" + QUIZ.length + "题</div>" +
          "<p>编号" + CY.esc(sid) + "，" + ARMS[currentArm].name.split("　")[0] + "，学习" + dwell + "秒，播放声调" + audioClicks + "次，作答" + answered + "题。</p>" +
          "<p>下载的记录可直接交给 <code>chaoyin_bowu_core/rct_analytics.py</code> 做协方差分析。</p>";
        $("btn-csv").style.display = "inline-block";
      });

      $("btn-csv").addEventListener("click", function () {
        if (!lastCsv) return;
        var url = URL.createObjectURL(new Blob(["\uFEFF" + lastCsv], { type: "text/csv;charset=utf-8;" }));
        var a = document.createElement("a");
        a.href = url;
        a.download = "chaoyin_rct_record_" + Date.now() + ".csv";
        a.click();
        URL.revokeObjectURL(url);
      });

      setArm("Arm3");
    })();
  </script>
</body>
</html>
